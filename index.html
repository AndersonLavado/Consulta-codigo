<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>CELSA - Consulta de Códigos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --celsa-red: #E30613; --celsa-dark: #1A1A1A; --bg: #F5F5F7; --line: #D1D1D6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--celsa-dark); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 600px; background: #FFF; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); overflow: hidden; height: fit-content; }
    
    header { background: #FFF; border-top: 5px solid var(--celsa-red); padding: 20px; text-align: center; border-bottom: 1px solid var(--line); }
    .logo-box { background: var(--celsa-red); color: #FFF; font-weight: 900; font-size: 24px; letter-spacing: 2px; padding: 6px 12px; border-radius: 4px; display: inline-block; }
    .logo-sub { font-size: 9px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 4px; color: #000; }
    header h1 { font-size: 18px; margin-top: 10px; color: #444; }
    
    .search-section { padding: 25px 20px; }
    .search-box { position: relative; }
    .search-box input {
      width: 100%; padding: 16px 16px 16px 45px; font-size: 16px;
      border: 2px solid var(--line); border-radius: 12px; outline: none; transition: all 0.2s;
    }
    .search-box input:focus { border-color: var(--celsa-red); box-shadow: 0 0 0 3px rgba(227,6,19,0.1); }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #999; font-size: 18px; }
    
    .results-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .result-item {
      padding: 15px; border: 1px solid var(--line); border-radius: 12px;
      background: #FAFAFA; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: all 0.2s;
    }
    .result-item:hover { background: #FFF; border-color: var(--celsa-red); box-shadow: 0 4px 12px rgba(227,6,19,0.08); transform: translateY(-2px); }
    .result-info { flex: 1; padding-right: 15px; }
    .result-prod { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .result-code {
      background: var(--celsa-red); color: #FFF; font-weight: 900;
      padding: 8px 14px; border-radius: 8px; font-size: 15px; letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(227,6,19,0.2); white-space: nowrap;
    }
    
    mark { background-color: #FFF0F0; color: var(--celsa-red); font-weight: 900; border-radius: 3px; padding: 0 2px; }
    
    .empty { text-align: center; padding: 30px; color: #999; font-size: 14px; }
    .loading { display: none; text-align: center; padding: 20px; color: var(--celsa-red); font-weight: 600; }
    .loading i { animation: spin 1s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <div class="logo-box">CELSA</div>
      <div class="logo-sub">CONDUCTORES ELÉCTRICOS</div>
    </div>
    <h1>Consulta de Códigos de Producto</h1>
  </header>

  <div class="search-section">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Escriba palabra clave (ej: CUF 104x 6 mm)..." autocomplete="off">
    </div>

    <div class="loading" id="loading">
      <i class="fas fa-circle-notch"></i> Buscando...
    </div>

    <div class="results-list" id="resultsList">
      <div class="empty">
        <i class="fas fa-box-open" style="font-size: 30px; color: #ddd; margin-bottom: 10px; display: block;"></i>
        Escriba al menos 2 letras para buscar.
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbw7lg3uNWXtzi9RFP8SXB_VQBv0Fvm0SsePf20Ooc9ypkBxEfTXzwe5tfc4pnJ6x92x/exec';
  
  const searchInput = document.getElementById('searchInput');
  const resultsList = document.getElementById('resultsList');
  const loading = document.getElementById('loading');
  let timeoutId = null;

  function resaltarTexto(texto, terminoOriginal) {
    let terminoNormalizado = terminoOriginal.replace(/(\d+(?:[xX]\d+(?:\.\d+)?)?)\s+(mm|awg|kcm)\b/gi, '$1$2');
    let palabras = terminoNormalizado.split(/\s+/).filter(p => p.length > 0);
    
    let resultado = texto;
    
    palabras.forEach(p => {
      let regexStr = p;
      if (/^\d+.*(mm|awg|kcm)$/i.test(p)) {
        const match = p.match(/^(\d+.*?)(mm|awg|kcm)$/i);
        if (match) {
          regexStr = `(${match[1]}\\s*${match[2]})`;
        }
      }
      
      const regex = new RegExp(`(${regexStr})`, 'gi');
      resultado = resultado.replace(regex, '<mark>$1</mark>');
    });
    
    return resultado;
  }

  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim();
    
    clearTimeout(timeoutId);
    
    if (query.length < 2) {
      resultsList.innerHTML = '<div class="empty"><i class="fas fa-box-open" style="font-size: 30px; color: #ddd; margin-bottom: 10px; display: block;"></i>Escriba al menos 2 letras para buscar.</div>';
      return;
    }

    loading.style.display = 'block';
    resultsList.style.display = 'none';

    timeoutId = setTimeout(() => {
      buscar(query);
    }, 400);
  });

  async function buscar(termino) {
    try {
      const url = API_URL + '?action=buscarProducto&q=' + encodeURIComponent(termino);
      const resp = await fetch(url);
      const res = await resp.json();

      loading.style.display = 'none';
      resultsList.style.display = 'flex';

      if (!res.ok) throw new Error(res.msg || 'Error en la búsqueda');

      if (res.data.length === 0) {
        resultsList.innerHTML = '<div class="empty"><i class="fas fa-search" style="font-size: 30px; color: #ddd; margin-bottom: 10px; display: block;"></i>No se encontraron productos.</div>';
        return;
      }

      resultsList.innerHTML = res.data.map(item => {
        const prodResaltado = resaltarTexto(item.producto, termino);
        
        return `
          <div class="result-item" onclick="copiarCodigo('${item.codigo}')">
            <div class="result-info">
              <div class="result-prod">${prodResaltado}</div>
            </div>
            <div class="result-code" title="Clic para copiar">${item.codigo}</div>
          </div>
        `;
      }).join('');

    } catch (err) {
      loading.style.display = 'none';
      resultsList.style.display = 'flex';
      resultsList.innerHTML = `<div class="empty" style="color:red;">Error: ${err.message}</div>`;
    }
  }

  function copiarCodigo(codigo) {
    navigator.clipboard.writeText(codigo).then(() => {
      const originalHTML = resultsList.innerHTML;
      resultsList.innerHTML = `
        <div class="empty" style="color: #00B894;">
          <i class="fas fa-check-circle" style="font-size: 40px; margin-bottom: 10px; display: block;"></i>
          Código <b>${codigo}</b> copiado al portapapeles
        </div>`;
      setTimeout(() => { resultsList.innerHTML = originalHTML; }, 1500);
    }).catch(() => {
      alert("Código: " + codigo);
    });
  }
</script>

</body>
</html>
